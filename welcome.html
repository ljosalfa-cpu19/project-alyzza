<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Welcome, My Love — Midnight Rose</title>
<link rel="stylesheet" href="css/style.css">
<style>
  /* Preloader — inline + critical so it paints before style.css or fonts arrive */
  #page-loader {
    position: fixed; inset: 0; z-index: 99999;
    background: #080910;
    display: flex; align-items: center; justify-content: center;
    transition: opacity 0.6s ease;
  }
  #page-loader.loaded { opacity: 0; pointer-events: none; }
  .loader-ring {
    width: 52px; height: 52px; border-radius: 50%;
    border: 3px solid rgba(214,179,106,0.25);
    border-top-color: #D6B36A;
    animation: loader-spin 0.9s linear infinite;
  }
  .loader-heart {
    position: absolute; font-size: 20px; color: #D6B36A;
    animation: loader-pulse 1.2s ease-in-out infinite;
  }
  @keyframes loader-spin { to { transform: rotate(360deg); } }
  @keyframes loader-pulse {
    0%, 100% { transform: scale(0.85); opacity: 0.7; }
    50% { transform: scale(1.05); opacity: 1; }
  }
</style>
</head>
<body data-page="welcome">
<div id="page-loader" aria-hidden="true"><div class="loader-ring"></div><span class="loader-heart">♡</span></div>
<div class="sky-bg"></div>
<div class="vignette"></div>
<div id="transition-veil" aria-hidden="true"></div>

<main class="stage">
  <div class="stage-inner page-fade">
    <h1 class="welcome-title">Hi, My Love&nbsp;♡</h1>
    <p class="welcome-sub">I made a little something for you...</p>
    <p class="welcome-line">This is for you Alyy!!</p>
    <a href="letter-intro.html" class="btn" data-transition>Continue&nbsp;♡</a>
  </div>
</main>

<script>
  if (sessionStorage.getItem("midnightRoseUnlocked") !== "true") {
    window.location.replace("lock1.html");
  }
</script>
<script src="js/main.js"></script>
<script src="js/autoplay-music.js"></script>

<audio id="bg-music" loop src="song.mp3" preload="auto"></audio>
<script src="js/preloader.js"></script>
</body>
</html>
