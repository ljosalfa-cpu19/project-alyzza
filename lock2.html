<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Another Memory — Midnight Rose</title>
<link rel="stylesheet" href="css/style.css">
</head>

<body data-page="lock2">

<div class="sky-bg deep"></div>
<div class="vignette"></div>
<div id="transition-veil" aria-hidden="true"></div>

<main class="stage">
  <div class="stage-inner page-fade">
    <div class="lock-illustration" aria-hidden="true">
      <svg viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path class="lock-shackle" d="M70 90 V65 C70 42 88 25 100 25 C112 25 130 42 130 65 V90"
              stroke="url(#g1)" stroke-width="9" stroke-linecap="round"/>
        <rect x="48" y="88" width="104" height="86" rx="16" fill="url(#b1)" stroke="#B88A44" stroke-width="2.5"/>
        <path class="lock-heart" d="M100 155 C86 141 66 129 66 111 C66 100 74 93 84 93 C92 93 98 98 100 105 C102 98 108 93 116 93 C126 93 134 100 134 111 C134 129 114 141 100 155 Z"
              fill="#5A1830" stroke="#D6B36A" stroke-width="2"/>
        <defs>
          <linearGradient id="g1" x1="70" y1="25" x2="130" y2="90" gradientUnits="userSpaceOnUse">
            <stop stop-color="#D6B36A"/><stop offset="1" stop-color="#B88A44"/>
          </linearGradient>
          <linearGradient id="b1" x1="48" y1="88" x2="152" y2="174" gradientUnits="userSpaceOnUse">
            <stop stop-color="#111426"/><stop offset="1" stop-color="#080910"/>
          </linearGradient>
        </defs>
      </svg>
    </div>

    <h1 class="lock-title">Another memory...</h1>
    <p class="lock-subtitle">Enter the day we confessed.</p>

    <form id="lock-form" class="password-form" autocomplete="off">
      <label for="lock-input">Date format: MM-DD-YYYY</label>
      <input type="text" id="lock-input" name="lock-input" placeholder="MM-DD-YYYY" inputmode="numeric" aria-describedby="lock-message" maxlength="10" required>
      <button type="submit" class="btn">Unlock&nbsp;♡</button>
    </form>

    <p class="lock-message" id="lock-message" role="status" aria-live="polite"></p>

    <div class="lock-progress" aria-hidden="true">
      <span class="dot active"></span>
      <span class="dot active"></span>
      <span class="dot"></span>
    </div>
  </div>
</main>

<script src="js/main.js"></script>
<script src="js/autoplay-music.js"></script>

<script>
  if (sessionStorage.getItem("midnightRoseLock1") !== "true") {
    window.location.replace("lock1.html");
  }
  window.MR_LOCK_CONFIG = {
    answer: "05-11-26",
    next: "lock3.html",
    isFinal: false,
    rememberKey: "midnightRoseLock2",
    wrongMessages: [
      "Not quite, love... think of that special day. ♡",
      "Almost... but that's not the day. ♡"
    ]
  };
</script>

<script>
  // Auto-inserts dashes as the user types the date (MM-DD-YYYY)
  (function () {
    const input = document.getElementById("lock-input");
    if (!input) return;
    input.addEventListener("input", function () {
      let digits = this.value.replace(/\D/g, "").slice(0, 8);
      let formatted = digits;
      if (digits.length > 4) {
        formatted = digits.slice(0, 2) + "-" + digits.slice(2, 4) + "-" + digits.slice(4);
      } else if (digits.length > 2) {
        formatted = digits.slice(0, 2) + "-" + digits.slice(2);
      }
      this.value = formatted;
    });
  })();
</script>

<script src="js/password.js"></script>

<audio id="bg-music" loop src="song.mp3" preload="auto"></audio>

</body>
</html>
