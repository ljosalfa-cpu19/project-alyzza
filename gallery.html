<!DOCTYPE html>

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gallery — Midnight Rose</title>
<link rel="stylesheet" href="css/style.css">
<style>
  /* Preloader — inline + critical so it paints before style.css or fonts arrive */
  #page-loader {
    position: fixed; inset: 0; z-index: 99999;
    background: #080910;
    display: flex; align-items: center; justify-content: center;
    transition: opacity 0.6s ease;
  }
  #page-loader.loaded { opacity: 0; pointer-events: none; }
  .loader-ring {
    width: 52px; height: 52px; border-radius: 50%;
    border: 3px solid rgba(214,179,106,0.25);
    border-top-color: #D6B36A;
    animation: loader-spin 0.9s linear infinite;
  }
  .loader-heart {
    position: absolute; font-size: 20px; color: #D6B36A;
    animation: loader-pulse 1.2s ease-in-out infinite;
  }
  @keyframes loader-spin { to { transform: rotate(360deg); } }
  @keyframes loader-pulse {
    0%, 100% { transform: scale(0.85); opacity: 0.7; }
    50% { transform: scale(1.05); opacity: 1; }
  }
</style>
</head>

</nav>

<header class="page-header page-fade">

<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Photo viewer">
  <button class="lightbox-close" id="lightbox-close" aria-label="Close photo viewer">✕</button>

  <div class="lightbox-inner">
    <img id="lightbox-img" src="" alt="">

    <div class="counter" id="lightbox-counter"></div>
  </div>
  <button class="lightbox-btn lightbox-next" id="lightbox-next" aria-label="Next photo">›</button>
