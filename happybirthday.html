<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday, My Love — Midnight Rose</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="happybirthday">

<div class="sky-bg"></div>
<div class="vignette"></div>
<div id="transition-veil" aria-hidden="true"></div>
<div id="celebration-layer" aria-hidden="true"></div>

<main class="stage">
  <div class="stage-inner page-fade">
    <p class="eyebrow-note" style="margin-bottom:1em;">✦ &nbsp; today is your day &nbsp; ✦</p>
    <!-- ✏️ EDIT ME: swap in her name here if you'd like it personalized -->
    <h1 class="birthday-title">Happy Birthday,<br>My Love&nbsp;♡</h1>
    <p class="birthday-sub">I made you a little world. Come see it.</p>
    <button class="btn" id="birthday-continue">Continue&nbsp;♡</button>
  </div>
</main>

<script>
  if (sessionStorage.getItem("midnightRoseUnlocked") !== "true") {
    window.location.replace("lock1.html");
  }
</script>

<script src="js/main.js"></script>
<script src="js/autoplay-music.js"></script>

<script>
  (function () {
    const prefersReducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    const layer = document.getElementById("celebration-layer");
    const confettiColors = ["#D6B36A", "#B88A44", "#C98298", "#8E3A58", "#FFF5E8"];
    const balloonColors = ["#5A1830", "#8E3A58", "#B88A44", "#111426"];

    function spawnConfetti(count) {
      for (let i = 0; i < count; i++) {
        const el = document.createElement("span");
        el.className = "confetti-piece";
        el.style.left = Math.random() * 100 + "vw";
        el.style.background = confettiColors[Math.floor(Math.random() * confettiColors.length)];
        el.style.animationDuration = 3 + Math.random() * 2.5 + "s";
        el.style.animationDelay = Math.random() * 1.2 + "s";
        if (Math.random() > 0.5) el.style.borderRadius = "50%";
        layer.appendChild(el);
        setTimeout(() => el.remove(), 7000);
      }
    }

    function spawnBalloons(count) {
      for (let i = 0; i < count; i++) {
        const el = document.createElement("span");
        el.className = "balloon-piece";
        el.style.left = 5 + Math.random() * 90 + "vw";
        el.style.background = balloonColors[Math.floor(Math.random() * balloonColors.length)];
        el.style.setProperty("--sway", (Math.random() * 60 - 30) + "px");
        el.style.animationDuration = 6 + Math.random() * 4 + "s";
        el.style.animationDelay = Math.random() * 1.5 + "s";
        layer.appendChild(el);
        setTimeout(() => el.remove(), 12000);
      }
    }

    if (!prefersReducedMotion) {
      spawnConfetti(60);
      spawnBalloons(9);
      window.MidnightRose?.burstHearts(16);

      // a second smaller burst a moment later, for good measure
      setTimeout(() => {
        spawnConfetti(30);
        spawnBalloons(4);
      }, 2600);
    }

    document.getElementById("birthday-continue").addEventListener("click", function () {
      const veil = document.getElementById("transition-veil");
      window.MidnightRose?.burstHearts(14);
      this.disabled = true;
      setTimeout(() => {
        veil.classList.add("active");
        setTimeout(() => { window.location.href = "welcome.html"; }, 500);
      }, 500);
    });
  })();
</script>

</body>
</html>
